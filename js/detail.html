<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AML Modest Clothes — تفاصيل المنتج</title>
<link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1NK3poi7l0jqFSfhk8sig490geYi3ak5J&sz=w64">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navPlaceholder"></div>

<div class="detail-page">
  <a class="detail-back" href="index.html">← العودة للمتجر</a>
  <div class="detail-body">
    <div class="detail-img"><img id="d-img" src="" alt=""></div>
    <div>
      <h1 class="detail-name" id="d-name"></h1>
      <p class="detail-price" id="d-price"></p>
      <p class="detail-label"><i class="ti ti-ruler-measure" aria-hidden="true"></i> اختاري مقاسك</p>
      <div class="sizes-row" id="sizes-row">
        <button class="size-btn" onclick="selectSize(this,'مقاس 1 (50-85 كيلو)')">
          <span class="size-tag">مقاس 1</span><span class="size-desc">من 50 إلى 85 كيلو</span>
        </button>
        <button class="size-btn" onclick="selectSize(this,'مقاس 2 (90-100 كيلو)')">
          <span class="size-tag">مقاس 2</span><span class="size-desc">من 90 إلى 100 كيلو</span>
        </button>
        <button class="size-btn" onclick="selectSize(this,'مقاس 3 (105-120 كيلو)')">
          <span class="size-tag">مقاس 3</span><span class="size-desc">من 105 إلى 120 كيلو</span>
        </button>
      </div>
      <p class="size-req" id="size-req">يرجى اختيار المقاس أولاً</p>
      <p class="detail-label"><i class="ti ti-palette" aria-hidden="true"></i> الألوان</p>
      <div class="colors-note">
        كل الألوان متاحة · للتأكيد من الألوان تواصلي معنا على
        <a href="https://www.instagram.com/byaml_eg?hl=ar" target="_blank">@byaml_eg</a>
      </div>
      <button class="add-btn" onclick="handleAdd()"><i class="ti ti-shopping-bag" aria-hidden="true"></i> أضيفي للسلة</button>
    </div>
  </div>
  <footer style="margin-top:40px"><p>AML Modest Clothes — جميع الحقوق محفوظة 2025</p></footer>
</div>

<div id="drawersPlaceholder"></div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
initPage();

let curP = null;
let selSize = '';

// Load product from URL param
(function() {
  let params = new URLSearchParams(location.search);
  let pid = params.get('id');
  let p = pid ? getProductById(pid) : null;
  if (!p) { location.href = 'index.html'; return; }
  curP = p;
  document.title = p.name + ' — AML Modest Clothes';
  document.getElementById('d-img').src = imgUrl(p.imgId, 'w800');
  document.getElementById('d-name').textContent = p.name;
  document.getElementById('d-price').textContent = p.price + ' جنيه';
})();

function selectSize(btn, label) {
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selSize = label;
  document.getElementById('size-req').classList.remove('show');
}

function handleAdd() {
  if (!selSize) { document.getElementById('sizeWarn').classList.add('open'); return; }
  addToCart(curP.name, curP.price, imgUrl(curP.imgId, 'w120'), selSize);
  openCart();
}
</script>
</body>
</html>
